<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        94%, 98% { transform: scaleY(0.1); }
        96% { transform: scaleY(1); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-3px) rotate(-1.5deg); }
        50% { transform: translateY(-5px) rotate(0deg); }
        75% { transform: translateY(-3px) rotate(1.5deg); }
      }
      @keyframes wiggleLeft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(-15deg); }
      }
      @keyframes wiggleRight {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(15deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      @keyframes scanEyes {
        0%, 20%, 80%, 100% { transform: translateX(0); }
        30%, 40% { transform: translateX(-3px); }
        60%, 70% { transform: translateX(3px); }
      }
      .robot-body {
        transform-origin: 50% 50%;
        animation: float 3s ease-in-out infinite;
      }
      .eye {
        transform-origin: center;
        transform-box: fill-box;
        animation: blink 5s infinite;
      }
      .eye-group {
        animation: scanEyes 7s ease-in-out infinite;
      }
      .ear-left {
        transform-origin: right center;
        transform-box: fill-box;
        animation: wiggleLeft 2.2s ease-in-out infinite;
      }
      .ear-right {
        transform-origin: left center;
        transform-box: fill-box;
        animation: wiggleRight 2.8s ease-in-out infinite;
      }
      .antenna-glow {
        transform-origin: center;
        transform-box: fill-box;
        animation: pulseGlow 1.2s ease-in-out infinite;
      }
    </style>
    <!-- Glowing Effect for LEDs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Premium 3D Orange Gradient for the Shell -->
    <linearGradient id="shellGradient" x1="16" y1="24" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9a44" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Deep Glass Visor Gradient -->
    <linearGradient id="visorGradient" x1="22" y1="34" x2="78" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cyberpunk Scanline Pattern for Visor -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Glowing bottom shadow (Stays on ground, not in robot-body) -->
  <ellipse cx="50" cy="94" rx="26" ry="4" fill="#ea580c" opacity="0.3" filter="url(#glow)" />

  <g class="robot-body">
    <!-- Modern Tech Antennas (Soft curved stems) -->
    <path d="M42 26 Q 36 18 32 12" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M58 26 Q 64 18 68 12" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none" />
    
    <!-- Glowing LED Antenna Tips (Soft Ovals) -->
    <ellipse class="antenna-glow" cx="31" cy="11" rx="5" ry="4" fill="#22d3ee" filter="url(#glow)" />
    <ellipse cx="31" cy="11" rx="2" ry="1.5" fill="#ffffff" />
    <ellipse class="antenna-glow" cx="69" cy="11" rx="5" ry="4" fill="#22d3ee" filter="url(#glow)" />
    <ellipse cx="69" cy="11" rx="2" ry="1.5" fill="#ffffff" />

    <!-- Mechanical Side Nodes (Robot Ears) - fully pill shaped -->
    <rect class="ear-left" x="11" y="38" width="10" height="30" rx="5" fill="#334155" />
    <rect class="ear-right" x="79" y="38" width="10" height="30" rx="5" fill="#334155" />
    
    <!-- Outer Casing (Softer, rounder squircle) -->
    <rect x="16" y="24" width="68" height="62" rx="26" fill="url(#shellGradient)" />
    
    <!-- 3D Casing Highlights & Shadows -->
    <rect x="16" y="24" width="68" height="62" rx="26" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4" />
    <path d="M19 64 C 19 80 28 86 38 86 L62 86 C 72 86 81 80 81 64" stroke="#9a3412" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none" />

    <!-- Futuristic Panoramic Visor (Extremely round ends) -->
    <rect x="22" y="35" width="56" height="36" rx="18" fill="url(#visorGradient)" />
    
    <!-- Scanlines over Visor (Digital Texture) -->
    <rect x="22" y="35" width="56" height="36" rx="18" fill="url(#scanlines)" />

    <!-- Visor Inner Glow (Subtle Cyan Rim) -->
    <rect x="22" y="35" width="56" height="36" rx="18" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Glossy Glass Reflection (Curved organic shape) -->
    <path d="M22 51 C 22 43 28 35 38 35 L62 35 C 70 35 78 41 78 47 C 60 62 40 39 22 51 Z" fill="#ffffff" opacity="0.1" />

    <!-- ========================================== -->
    <!-- LED DIGITAL DISPLAY (Face Expression)      -->
    <!-- ========================================== -->

    <!-- Soft Pill/Oval Eyes (Very modern and friendly like EVE/Astro Bot) -->
    <g class="eye-group">
      <ellipse class="eye" cx="36" cy="48" rx="4.5" ry="6.5" fill="#ffffff" filter="url(#glow)" />
      <ellipse class="eye" cx="64" cy="48" rx="4.5" ry="6.5" fill="#ffffff" filter="url(#glow)" />
    </g>

    <!-- Digital Cheeks (Soft oval blushes) -->
    <ellipse cx="28" cy="55" rx="3.5" ry="2.5" fill="#22d3ee" opacity="0.85" filter="url(#glow)" />
    <ellipse cx="72" cy="55" rx="3.5" ry="2.5" fill="#22d3ee" opacity="0.85" filter="url(#glow)" />

    <!-- Soft Capsule Mouth (Friendly and cute tech) -->
    <rect x="44" y="56" width="12" height="4" rx="2" fill="#22d3ee" filter="url(#glow)" />
    
    <!-- Subtle curve to make the mouth look like a tiny smile -->
    <path d="M46 59 Q 50 61 54 59" stroke="#020617" stroke-width="1" fill="none" opacity="0.5" />
  </g>
</svg>
