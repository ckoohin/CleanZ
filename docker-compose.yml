services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./be/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
        NEXT_PUBLIC_CLIENT_URL: ${NEXT_PUBLIC_CLIENT_URL:-http://localhost:3020}
        NEXT_PUBLIC_GOONG_API_KEY: ${NEXT_PUBLIC_GOONG_API_KEY:-}
        NEXT_PUBLIC_GOONG_MAPTILES_KEY: ${NEXT_PUBLIC_GOONG_MAPTILES_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3020:3020"
    depends_on:
      backend:
        condition: service_healthy