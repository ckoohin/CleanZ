services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${DB_DATABASE:?DB_DATABASE is required in be/.env}"
        : "$${DB_USERNAME:?DB_USERNAME is required in be/.env}"
        : "$${DB_PASSWORD:?DB_PASSWORD is required in be/.env}"
        export POSTGRES_DB="$${DB_DATABASE}"
        export POSTGRES_USER="$${DB_USERNAME}"
        export POSTGRES_PASSWORD="$${DB_PASSWORD}"
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - --
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${DB_USERNAME}\" -d \"$${DB_DATABASE}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    # Cấu hình mặc định, không đặt password → backend kết nối được ngay khi deploy.
    # An toàn vì Redis KHÔNG publish ra host, chỉ nằm trong mạng nội bộ compose.
    # Bật AOF để job BullMQ đang chờ (dispatch, check-in, timeout phụ phí,
    # notification, mail) không mất khi container restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      secrets:
        - backend_env
    restart: unless-stopped
    env_file:
      - ./be/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: "5000"
      TZ: Asia/Ho_Chi_Minh
      # ─── PostgreSQL/PostGIS ───────────────────────────────────────────────────
      # Tên service `postgres` được Docker DNS phân giải trong Compose network.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_MIGRATIONS_RUN: "true"
      # ─── Redis ────────────────────────────────────────────────────────────────
      # Ghi đè .env: trong container "localhost" là chính backend, không phải
      # Redis. REDIS_PASSWORD rỗng để không gửi AUTH (Redis đang chạy không auth) —
      # nếu gửi AUTH tới Redis không đặt password sẽ lỗi.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # ─── Domain production ────────────────────────────────────────────────────
      # FRONTEND_URL quyết định CORS HTTP (main.ts) và CORS WebSocket
      # (ws-cors.helper.ts) → bắt buộc đúng domain FE, nếu không realtime bị chặn.
      FRONTEND_URL: ${FRONTEND_URL:-https://cleanz.online}
      BACKEND_URL: ${BACKEND_URL:-https://api.cleanz.online/api/v1}
      # OAuth callback phải trùng tuyệt đối với cấu hình trên Google/Facebook console.
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.cleanz.online/api/v1/auth/google/callback}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-https://api.cleanz.online/api/v1/auth/facebook/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # TLS do proxy ngoài đảm nhiệm. Mặc định bind loopback (proxy chạy CÙNG server)
    # để cổng HTTP trần không lộ ra Internet. Nếu proxy nằm ở máy khác, set
    # BIND_HOST=0.0.0.0 trong .env ở thư mục gốc.
    ports:
      - "${BIND_HOST:-127.0.0.1}:5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      secrets:
        - frontend_env
    restart: unless-stopped
    env_file:
      - ./fe/.env
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BIND_HOST:-127.0.0.1}:3020:3020"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Dữ liệu PostgreSQL/PostGIS. Volume không thay thế backup ngoài VPS.
  postgres-data:
  # Giữ AOF của Redis qua các lần restart/redeploy để không mất job đang chờ.
  redis-data:

secrets:
  # BuildKit chỉ mount file trong đúng bước build, không lưu khóa vào image layer.
  backend_env:
    file: ./be/.env
  frontend_env:
    file: ./fe/.env
