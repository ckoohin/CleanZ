# PostgreSQL do Supabase quản lý — KHÔNG còn service `postgres` trong compose.
# Host/port/user/password/database lấy từ `be/.env` (xem README phần Supabase).
# Redis vẫn chạy nội bộ vì Supabase không cung cấp Redis.
services:
  adminer:
    image: adminer:5.4.2
    restart: unless-stopped
    environment:
      # Điền sẵn host Supabase vào form đăng nhập cho tiện; vẫn gõ tay được.
      ADMINER_DEFAULT_SERVER: ${DB_HOST:-}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:8081:8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    # Cấu hình mặc định, không đặt password → backend kết nối được ngay khi deploy.
    # An toàn vì Redis KHÔNG publish ra host, chỉ nằm trong mạng nội bộ compose.
    # Bật AOF để job BullMQ đang chờ (dispatch, check-in, timeout phụ phí,
    # notification, mail) không mất khi container restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      secrets:
        - backend_env
    restart: unless-stopped
    env_file:
      - ./be/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      NODE_ENV: production
      PORT: "5000"
      TZ: Asia/Ho_Chi_Minh
      # ─── PostgreSQL/PostGIS (Supabase) ────────────────────────────────────────
      # DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_DATABASE lấy từ `be/.env` —
      # KHÔNG ghi đè ở đây nữa, vì DB không còn nằm trong mạng compose.
      #
      # Chọn cổng theo chế độ pooler của Supabase:
      #   5432 (session)     — dùng cái này. Giữ session nên prepared statement
      #                        của TypeORM và migration (DDL) chạy đúng.
      #   6543 (transaction) — KHÔNG dùng cho backend này: pooler cắt session sau
      #                        mỗi transaction, làm hỏng prepared statement và
      #                        `migrationsRun` lúc khởi động.
      DB_SSL: ${DB_SSL:-true}
      # Chạy migration khi khởi động. Đặt "false" nếu deploy nhiều instance —
      # nhiều container cùng chạy migration trên một DB dùng chung sẽ đua nhau.
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      # ─── Redis ────────────────────────────────────────────────────────────────
      # Ghi đè .env: trong container "localhost" là chính backend, không phải
      # Redis. REDIS_PASSWORD rỗng để không gửi AUTH (Redis đang chạy không auth) —
      # nếu gửi AUTH tới Redis không đặt password sẽ lỗi.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      AUTH_DEBUG_LOG: ${AUTH_DEBUG_LOG:-false}
      # ─── Domain production ────────────────────────────────────────────────────
      # FRONTEND_URL quyết định CORS HTTP (main.ts) và CORS WebSocket
      # (ws-cors.helper.ts) → bắt buộc đúng domain FE, nếu không realtime bị chặn.
      FRONTEND_URL: ${FRONTEND_URL:-https://cleanz.online}
      BACKEND_URL: ${BACKEND_URL:-https://api.cleanz.online/api/v1}
      # OAuth callback phải trùng tuyệt đối với cấu hình trên Google/Facebook console.
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.cleanz.online/api/v1/auth/google/callback}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-https://api.cleanz.online/api/v1/auth/facebook/callback}
    depends_on:
      redis:
        condition: service_healthy
    # TLS do proxy ngoài đảm nhiệm. Mặc định bind loopback (proxy chạy CÙNG server)
    # để cổng HTTP trần không lộ ra Internet. Nếu proxy nằm ở máy khác, set
    # BIND_HOST=0.0.0.0 trong .env ở thư mục gốc.
    ports:
      - "${BIND_HOST:-127.0.0.1}:5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      secrets:
        - frontend_env
    restart: unless-stopped
    env_file:
      - ./fe/.env
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.cleanz.online/api/v1}
      NEXT_PUBLIC_CLIENT_URL: ${NEXT_PUBLIC_CLIENT_URL:-https://cleanz.online}
    ports:
      - "${BIND_HOST:-127.0.0.1}:3020:3020"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Giữ AOF của Redis qua các lần restart/redeploy để không mất job đang chờ.
  # Không còn volume Postgres: dữ liệu nằm ở Supabase, backup theo Supabase.
  redis-data:

secrets:
  # BuildKit chỉ mount file trong đúng bước build, không lưu khóa vào image layer.
  backend_env:
    file: ./be/.env
  frontend_env:
    file: ./fe/.env
